name: ci

# Every PR and every push to main: repository lint and the YAML parser self-test.
# The behaviour evals run only on demand, because they call a model and cost money.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      evals:
        description: Run the behaviour evals (needs the ANTHROPIC_API_KEY secret)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML for the parser self-test
        run: python3 -m pip install --quiet pyyaml

      - name: Repository lint
        run: python3 scripts/lint

      - name: YAML parser self-test
        run: python3 scripts/sync --selftest

  tools-py39:
    # The tools promise python3 3.9+ with the standard library only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Tool self-tests and examples on Python 3.9
        run: python3 scripts/lint --only tools,examples

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.evals
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without an API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the evals."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.key.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Run the evals
        if: steps.key.outputs.skip != 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin eval . --runs 3 --allow-tools Bash --trust-plugin --no-publish \
            --threshold 0.8 --max-cost-usd 20 --json results.json

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.skip != 'true'
        with:
          name: eval-results
          path: results.json
          if-no-files-found: ignore
